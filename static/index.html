<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    New Chat
                </button>
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18" />
                    </svg>
                </button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Chat history items will be inserted here -->
            </div>
            <div class="sidebar-footer">
                <button class="clear-history-btn" onclick="clearAllChats()">
                    Clear History
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18" />
                    </svg>
                </button>
                <div class="logo">
                    <span class="logo-icon">🤖</span>
                    <span class="logo-text">AI Agent</span>
                </div>
                <div class="model-selector">
                    <button class="model-dropdown-btn" id="modelDropdownBtn" onclick="toggleModelDropdown()">
                        <span id="selectedModelText">grok-4-fast</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </button>
                    <div class="model-dropdown" id="modelDropdown">
                        <div class="model-option" data-model="grok-4-fast" onclick="selectModel('grok-4-fast')">
                            <span class="model-name">grok-4-fast</span>
                            <span class="model-check" id="check-grok-4-fast">✓</span>
                        </div>
                        <div class="model-option" data-model="deepseek" onclick="selectModel('deepseek')">
                            <span class="model-name">deepseek</span>
                            <span class="model-check" id="check-deepseek"></span>
                        </div>
                        <div class="model-option" data-model="supermind-agent-v1"
                            onclick="selectModel('supermind-agent-v1')">
                            <span class="model-name">supermind-agent-v1</span>
                            <span class="model-check" id="check-supermind-agent-v1"></span>
                        </div>
                        <div class="model-option" data-model="gemini-2.5-pro" onclick="selectModel('gemini-2.5-pro')">
                            <span class="model-name">gemini-2.5-pro</span>
                            <span class="model-check" id="check-gemini-2.5-pro"></span>
                        </div>
                        <div class="model-option" data-model="gemini-3-flash-preview"
                            onclick="selectModel('gemini-3-flash-preview')">
                            <span class="model-name">gemini-3-flash-preview</span>
                            <span class="model-check" id="check-gemini-3-flash-preview"></span>
                        </div>
                        <div class="model-option" data-model="gpt-5" onclick="selectModel('gpt-5')">
                            <span class="model-name">gpt-5</span>
                            <span class="model-check" id="check-gpt-5"></span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Chat Container -->
            <main class="chat-container" id="chatContainer">
                <!-- Welcome Message -->
                <div class="welcome-message" id="welcomeMessage">
                    <div class="welcome-icon">✨</div>
                    <h1>How can I help you today?</h1>
                    <p>I can search the web and read pages to find information for you.</p>
                    <div class="suggestions">
                        <button class="suggestion-btn"
                            onclick="useSuggestion('What is the latest version of Python and its new features?')">
                            Latest Python version
                        </button>
                        <button class="suggestion-btn" onclick="useSuggestion('Search for the latest news about AI')">
                            Latest AI news
                        </button>
                        <button class="suggestion-btn" onclick="useSuggestion('Who won the most recent Super Bowl?')">
                            Super Bowl winner
                        </button>
                    </div>
                </div>

                <!-- Messages will be inserted here -->
                <div class="messages" id="messages"></div>

                <!-- Thinking Indicator -->
                <div class="thinking-container" id="thinkingContainer" style="display: none;">
                    <div class="thinking-bubble">
                        <div class="thinking-avatar">🤖</div>
                        <div class="thinking-content">
                            <div class="thinking-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <div class="thinking-text" id="thinkingText">Thinking...</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="input-area">
                <form id="chatForm" class="input-form">
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Message AI Agent..." rows="1" autofocus></textarea>
                        <button type="submit" id="sendButton" class="send-button">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </form>
                <p class="disclaimer">AI Agent uses web search and can read pages. Responses may not always be accurate.
                </p>
            </footer>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
